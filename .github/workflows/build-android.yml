name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set VITE_API_URL
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "VITE_API_URL=https://uceconnectprod.programacionwebuce.net" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=https://uceconnectqa.programacionwebuce.net" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Sync Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Build Android APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uceconnect-${{ github.event.inputs.environment }}-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk